<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administration - Avis Déménageurs</title>
    <link rel="stylesheet" href="style.css">
    <style>
        :root {
            --primary-color: #1e3a8a;
            --secondary-color: #3b82f6;
            --success-color: #10b981;
            --light-color: #f8fafc;
            --dark-color: #1e293b;
            --border-color: #e2e8f0;
            --warning-color: #fbbf24;
            --danger-color: #f87171;
        }

        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f4;
            color: #333;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.05);
        }

        h1, h2 {
            color: var(--primary-color);
            margin-bottom: 20px;
        }

        h1 {
            text-align: center;
            font-size: 2rem;
            margin-bottom: 30px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--secondary-color);
        }

        h2 {
            font-size: 1.5rem;
            margin-top: 40px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .avis-section {
            margin-bottom: 40px;
        }

        .avis-count {
            background-color: var(--secondary-color);
            color: white;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 0.9rem;
            font-weight: bold;
        }

        .avis-item {
            border: 1px solid var(--border-color);
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 8px;
            background: var(--light-color);
            position: relative;
            transition: all 0.3s;
        }

        .avis-item:hover {
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            transform: translateY(-2px);
        }

        .avis-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .avis-meta {
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 10px;
        }

        .note-display {
            display: flex;
            align-items: center;
            margin-left: 10px;
        }

        .stars {
            color: var(--warning-color);
            margin-right: 5px;
        }

        .valider-btn {
            background-color: var(--success-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .valider-btn:hover {
            background-color: #0d9488;
            transform: translateY(-1px);
        }

        .empty-message {
            text-align: center;
            padding: 20px;
            color: #666;
            font-style: italic;
            background-color: rgba(0, 0, 0, 0.02);
            border-radius: 8px;
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .delete-btn {
            background-color: var(--danger-color);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s;
        }

        .delete-btn:hover {
            background-color: #dc2626;
            transform: translateY(-1px);
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 1.8rem;
            }

            h2 {
                font-size: 1.3rem;
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }

            .avis-item {
                padding: 15px;
            }

            .actions {
                flex-direction: column;
            }

            .valider-btn, .delete-btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Gestion des avis sur les déménageurs</h1>

        <!-- Section des avis en attente -->
        <div class="avis-section">
            <h2>
                Avis en attente de validation
                <span class="avis-count" id="pending-count">0</span>
            </h2>
            <div id="pending-avis-list"></div>
        </div>

        <!-- Section des avis validés -->
        <div class="avis-section">
            <h2>
                Avis validés
                <span class="avis-count" id="validated-count">0</span>
            </h2>
            <div id="validated-avis-list"></div>
        </div>
    </div>

    <script>
        // Charger et afficher les avis en attente
        function loadPendingAvis() {
            const pendingAvis = JSON.parse(localStorage.getItem('pendingAvisDemenageurs')) || [];
            const container = document.getElementById('pending-avis-list');
            const countElement = document.getElementById('pending-count');

            if (countElement) countElement.textContent = pendingAvis.length;

            if (!container) return;

            if (pendingAvis.length === 0) {
                container.innerHTML = '<p class="empty-message">Aucun avis en attente de validation.</p>';
                return;
            }

            container.innerHTML = pendingAvis.map(avis => {
                const stars = '★'.repeat(parseInt(avis.note)) + '☆'.repeat(5 - parseInt(avis.note));
                return `
                <div class="avis-item">
                    <div class="avis-header">
                        <h3>${avis.nom}</h3>
                        <span class="avis-meta">${new Date(avis.date).toLocaleDateString('fr-FR')}</span>
                    </div>
                    <p class="avis-meta">
                        <strong>Société:</strong> ${avis.societe} |
                        <span class="note-display">
                            <span class="stars">${stars}</span>
                            (${avis.note}/5)
                        </span>
                    </p>
                    <p>${avis.commentaire}</p>
                    <div class="actions">
                        <button class="valider-btn" onclick="validateAvis(${avis.id})">Valider</button>
                        <button class="delete-btn" onclick="deleteAvis(${avis.id}, 'pending')">Supprimer</button>
                    </div>
                </div>`;
            }).join('');
        }

        // Charger et afficher les avis validés
        function loadValidatedAvis() {
            const validatedAvis = JSON.parse(localStorage.getItem('validatedAvisDemenageurs')) || [];
            const container = document.getElementById('validated-avis-list');
            const countElement = document.getElementById('validated-count');

            if (countElement) countElement.textContent = validatedAvis.length;

            if (!container) return;

            if (validatedAvis.length === 0) {
                container.innerHTML = '<p class="empty-message">Aucun avis validé.</p>';
                return;
            }

            container.innerHTML = validatedAvis.map(avis => {
                const stars = '★'.repeat(parseInt(avis.note)) + '☆'.repeat(5 - parseInt(avis.note));
                return `
                <div class="avis-item">
                    <div class="avis-header">
                        <h3>${avis.nom}</h3>
                        <span class="avis-meta">${new Date(avis.date).toLocaleDateString('fr-FR')}</span>
                    </div>
                    <p class="avis-meta">
                        <strong>Société:</strong> ${avis.societe} |
                        <span class="note-display">
                            <span class="stars">${stars}</span>
                            (${avis.note}/5)
                        </span>
                    </p>
                    <p>${avis.commentaire}</p>
                    <div class="actions">
                        <button class="delete-btn" onclick="deleteAvis(${avis.id}, 'validated')">Supprimer</button>
                    </div>
                </div>`;
            }).join('');
        }

        // Valider un avis
        function validateAvis(avisId) {
            let pendingAvis = JSON.parse(localStorage.getItem('pendingAvisDemenageurs')) || [];
            let validatedAvis = JSON.parse(localStorage.getItem('validatedAvisDemenageurs')) || [];

            const avisIndex = pendingAvis.findIndex(avis => avis.id === avisId);
            if (avisIndex !== -1) {
                const avisToValidate = pendingAvis[avisIndex];
                validatedAvis.push(avisToValidate);
                pendingAvis.splice(avisIndex, 1);

                localStorage.setItem('pendingAvisDemenageurs', JSON.stringify(pendingAvis));
                localStorage.setItem('validatedAvisDemenageurs', JSON.stringify(validatedAvis));

                loadPendingAvis();
                loadValidatedAvis();
                showNotification("Avis validé avec succès !", "success");
            } else {
                showNotification("Erreur: avis non trouvé.", "error");
            }
        }

        // Supprimer un avis
        function deleteAvis(avisId, type) {
            let avisList = JSON.parse(localStorage.getItem(`${type}AvisDemenageurs`)) || [];
            const avisIndex = avisList.findIndex(avis => avis.id === avisId);

            if (avisIndex !== -1) {
                if (confirm("Êtes-vous sûr de vouloir supprimer cet avis ?")) {
                    avisList.splice(avisIndex, 1);
                    localStorage.setItem(`${type}AvisDemenageurs`, JSON.stringify(avisList));

                    if (type === 'pending') {
                        loadPendingAvis();
                    } else {
                        loadValidatedAvis();
                    }
                    showNotification("Avis supprimé avec succès.", "success");
                }
            } else {
                showNotification("Erreur: avis non trouvé.", "error");
            }
        }

        // Afficher une notification
        function showNotification(message, type) {
            const notification = document.createElement('div');
            notification.className = `notification ${type}`;
            notification.textContent = message;
            notification.style.position = 'fixed';
            notification.style.top = '20px';
            notification.style.right = '20px';
            notification.style.padding = '15px 20px';
            notification.style.borderRadius = '6px';
            notification.style.color = 'white';
            notification.style.fontWeight = '500';
            notification.style.zIndex = '1000';
            notification.style.boxShadow = '0 4px 12px rgba(0, 0, 0, 0.15)';
            notification.style.backgroundColor = type === 'success' ? '#10b981' : '#f87171';
            notification.style.transition = 'all 0.3s';

            document.body.appendChild(notification);

            setTimeout(() => {
                notification.style.opacity = '0';
                setTimeout(() => {
                    document.body.removeChild(notification);
                }, 300);
            }, 3000);
        }

        // Charger les avis au démarrage
        document.addEventListener('DOMContentLoaded', () => {
            loadPendingAvis();
            loadValidatedAvis();
        });
    </script>
</body>
</html>
