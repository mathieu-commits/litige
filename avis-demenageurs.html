<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avis Déménageurs - LitigeDemecall</title>
    <link rel="stylesheet" href="style.css">
    <!-- UNIQUEMENT le CSS nécessaire pour le menu mobile -->
    <style>
        /* Menu mobile - MINIMUM REQUISE */
        .menu-toggle {
            display: none;
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--dark-color);
            margin-left: auto;
            margin-right: 10px;
            z-index: 1001;
        }

        @media (max-width: 768px) {
            .menu-toggle {
                display: block;
            }
            .nav-links {
                display: none;
                position: absolute;
                top: 100%;
                left: 0;
                right: 0;
                background: white;
                flex-direction: column;
                padding: 20px;
                box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
                z-index: 1000;
            }
            .nav-links.active {
                display: flex;
            }
        }
    </style>
</head>
<body>
    <!-- Header avec menu mobile -->
    <header>
        <nav class="container">
            <a href="index.html" class="logo">
                <img src="logo.png" alt="Logo Demecall">
            </a>
            <button class="menu-toggle" aria-label="Ouvrir le menu">☰</button>
            <ul class="nav-links">
                <li><a href="index.html">Accueil</a></li>
                <li><a href="services.html">Nos Services</a></li>
                <li><a href="tarifs.html">Tarifs</a></li>
                <li><a href="avis.html">Avis Clients</a></li>
                <li><a href="avis-demenageurs.html" class="active">Avis Déménageurs</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
            <a href="contact.html" class="cta-button">Déposer mon dossier</a>
        </nav>
    </header>

    <!-- Le reste de ton HTML existant (inchangé) -->
    <!-- Hero Section -->
    <section class="hero">
        <div class="container">
            <h1>Laisser un avis sur un déménageur</h1>
            <p>Partagez votre expérience avec une société de déménagement pour aider les futurs clients.</p>
        </div>
    </section>

    <!-- Section pour soumettre un avis -->
    <section class="form-section">
        <div class="container">
            <h2>Laisser un avis sur un déménageur</h2>
            <div class="form-container">
                <!-- Ton formulaire existant -->
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <!-- Ton footer existant -->
    </footer>

    <!-- UNIQUEMENT le JavaScript pour le menu mobile -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const menuToggle = document.querySelector('.menu-toggle');
            const navLinks = document.querySelector('.nav-links');

            if (!menuToggle || !navLinks) return;

            // Basculer le menu
            menuToggle.addEventListener('click', function() {
                navLinks.classList.toggle('active');
            });

            // Fermer le menu quand on clique sur un lien
            navLinks.querySelectorAll('a').forEach(link => {
                link.addEventListener('click', function() {
                    if (window.innerWidth <= 768) {
                        navLinks.classList.remove('active');
                    }
                });
            });

            // Gestion du redimensionnement
            function handleResize() {
                if (window.innerWidth <= 768) {
                    menuToggle.style.display = 'block';
                } else {
                    menuToggle.style.display = 'none';
                    navLinks.style.display = 'flex';
                    navLinks.classList.remove('active');
                }
            }

            window.addEventListener('resize', handleResize);
            handleResize();
        });
    </script>
</body>
</html>
